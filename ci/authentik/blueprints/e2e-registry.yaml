# Authentik blueprint provisioning what the parity suite needs (validated
# against Authentik 2026.8.0):
#   - the test users (username/email/password from E2E_* env)
#   - a confidential OAuth2 provider + application at slug `registry`, so the
#     issuer is http://localhost:9000/application/o/registry/ and its JWKS is the
#     single key the backend trusts. The Nuxt BFF uses the authorization-code
#     flow; the suite's setup/teardown cleanup uses Authentik's password grant,
#     which is NOT classic ROPC — it authenticates a user by an App-password
#     token (intent app_password), so one is seeded below.
#
# Why so many accounts: the suite must assert refusals, and a refusal needs an
# identity that is NOT the administrator — several of them, because a refused or
# consumed account cannot be reused by the next journey. Every account shares
# E2E_PASSWORD, so no extra CI secret is required; usernames derive from
# E2E_USERNAME.
#
# Authentik auto-applies blueprints mounted under /blueprints/custom.
version: 1
metadata:
  name: registry-e2e
context:
  registry_client_id: !Env [ NUXT_IDP_CLIENT_ID, registry ]
  registry_client_secret: !Env [ NUXT_IDP_CLIENT_SECRET, registry-secret ]
entries:
  - model: authentik_core.user
    id: registry-user
    identifiers:
      username: !Env [ E2E_USERNAME, e2e ]
    attrs:
      # The parity suite asserts the signed-in user shows as "Spike Test"
      # (users/members/authentication specs). The custom profile mapping below
      # emits given_name/family_name from these attributes; the backend stores
      # them as first/last name.
      name: Spike Test
      attributes:
        given_name: Spike
        family_name: Test
      # A valid email is required by the serializer; login still accepts the
      # username at the identification stage, so E2E_USERNAME need not be one.
      email: !Env [ E2E_EMAIL, e2e@example.test ]
      password: !Env [ E2E_PASSWORD, "" ]
      is_active: true
      path: users

  # The cleanup credential (tests/global-cleanup.ts). Authentik's password grant
  # is not classic ROPC: the `password` field must be an App-password token, so
  # the sign-in password cannot be reused here. Declaring the token in the
  # blueprint rather than minting it by hand keeps every environment identical —
  # it was created with `ak shell` locally, which is exactly the kind of drift
  # that made the purge work nowhere.
  - model: authentik_core.token
    id: registry-cleanup-token
    identifiers:
      identifier: e2e-cleanup
    attrs:
      user: !KeyOf registry-user
      intent: app_password
      key: !Env [ E2E_CLEANUP_TOKEN, "" ]
      expiring: false
      description: E2E suite cleanup — purges stray projects and light users

  # The lesser actor. Seeded into the backend with the default global USER role
  # (ci/seed/seed.sql) and invited per-project as coordinator or participant, so
  # every role-gating and tenancy refusal has a real session to be refused in.
  # Also the block/unblock target — blocking is reversible, so it is safe to
  # reuse this account across runs.
  - model: authentik_core.user
    id: registry-user-member
    identifiers:
      username: !Format [ "%s-member", !Env [ E2E_USERNAME, e2e ] ]
    attrs:
      name: Nova Member
      attributes:
        given_name: Nova
        family_name: Member
      email: !Format [ "member-%s", !Env [ E2E_EMAIL, e2e@example.test ] ]
      password: !Env [ E2E_PASSWORD, "" ]
      is_active: true
      path: users

  # Deliberately NOT seeded into the backend: its first sign-in is the assertion
  # that a brand-new identity is auto-provisioned with the default USER role.
  # Teardown hard-deletes its backend row so the next run starts unprovisioned.
  - model: authentik_core.user
    id: registry-user-fresh
    identifiers:
      username: !Format [ "%s-fresh", !Env [ E2E_USERNAME, e2e ] ]
    attrs:
      name: Fresh Arrival
      attributes:
        given_name: Fresh
        family_name: Arrival
      email: !Format [ "fresh-%s", !Env [ E2E_EMAIL, e2e@example.test ] ]
      password: !Env [ E2E_PASSWORD, "" ]
      is_active: true
      path: users

  # Its email is deliberately the administrator's, so signing in with this
  # distinct provider identity must always be refused with AUTH_EMAIL_ALREADY_USED.
  # The refusal happens before any row is written, which is what makes the
  # scenario repeatable without cleanup.
  - model: authentik_core.user
    id: registry-user-clash
    identifiers:
      username: !Format [ "%s-clash", !Env [ E2E_USERNAME, e2e ] ]
    attrs:
      name: Clash Duplicate
      attributes:
        given_name: Clash
        family_name: Duplicate
      email: !Env [ E2E_EMAIL, e2e@example.test ]
      password: !Env [ E2E_PASSWORD, "" ]
      is_active: true
      path: users

  # The anonymization target. Anonymizing is irreversible by design, so this
  # account is consumed by the scenario that asserts an anonymized identity can
  # never sign in again; teardown hard-deletes its backend row to restore it.
  - model: authentik_core.user
    id: registry-user-burn
    identifiers:
      username: !Format [ "%s-burn", !Env [ E2E_USERNAME, e2e ] ]
    attrs:
      name: Burn Target
      attributes:
        given_name: Burn
        family_name: Target
      email: !Format [ "burn-%s", !Env [ E2E_EMAIL, e2e@example.test ] ]
      password: !Env [ E2E_PASSWORD, "" ]
      is_active: true
      path: users

  # The block/unblock target. Kept separate from `-member` on purpose: that
  # scenario signs in mid-test, and a second authorization-code grant for an
  # account whose session is already persisted would rotate its refresh token
  # and strand every later journey that uses it.
  - model: authentik_core.user
    id: registry-user-blocked
    identifiers:
      username: !Format [ "%s-blocked", !Env [ E2E_USERNAME, e2e ] ]
    attrs:
      name: Barred Account
      attributes:
        given_name: Barred
        family_name: Account
      email: !Format [ "blocked-%s", !Env [ E2E_EMAIL, e2e@example.test ] ]
      password: !Env [ E2E_PASSWORD, "" ]
      is_active: true
      path: users

  # The purge-guard target. Separate from `-burn`, which auth-provisioning
  # anonymises: the purge journeys need an identity that is still intact when they
  # run, and sharing one made them pass alone but fail in a full campaign.
  - model: authentik_core.user
    id: registry-user-purge
    identifiers:
      username: !Format [ "%s-purge", !Env [ E2E_USERNAME, e2e ] ]
    attrs:
      name: Purge Target
      attributes:
        given_name: Purge
        family_name: Target
      email: !Format [ "purge-%s", !Env [ E2E_EMAIL, e2e@example.test ] ]
      password: !Env [ E2E_PASSWORD, "" ]
      is_active: true
      path: users

  # One disposable identity PER destructive journey. `signout` is consumed by the
  # RP-initiated logout journey and `light` by the light-user linking one; both
  # used to borrow `fresh`, which auth-provisioning also consumes — the shared
  # account made those journeys order-dependent and the suite drifted by a couple
  # of tests between campaigns.
  - model: authentik_core.user
    id: registry-user-signout
    identifiers:
      username: !Format [ "%s-signout", !Env [ E2E_USERNAME, e2e ] ]
    attrs:
      name: Signing Out
      attributes:
        given_name: Signing
        family_name: Out
      email: !Format [ "signout-%s", !Env [ E2E_EMAIL, e2e@example.test ] ]
      password: !Env [ E2E_PASSWORD, "" ]
      is_active: true
      path: users

  - model: authentik_core.user
    id: registry-user-light
    identifiers:
      username: !Format [ "%s-light", !Env [ E2E_USERNAME, e2e ] ]
    attrs:
      name: Light Invitee
      attributes:
        given_name: Light
        family_name: Invitee
      email: !Format [ "light-%s", !Env [ E2E_EMAIL, e2e@example.test ] ]
      password: !Env [ E2E_PASSWORD, "" ]
      is_active: true
      path: users

  # The one identity the email mapping below does NOT vouch for. Its seeded row
  # (ci/seed/seed.sql) stays invited — oidc_id NULL — because the link is refused
  # before anything is written, which is what makes the AUTH_EMAIL_NOT_VERIFIED
  # journey repeatable with no cleanup at all, exactly like `-clash`.
  - model: authentik_core.user
    id: registry-user-unverified
    identifiers:
      username: !Format [ "%s-unverified", !Env [ E2E_USERNAME, e2e ] ]
    attrs:
      name: Unsure Address
      attributes:
        given_name: Unsure
        family_name: Address
        email_verified: false
      email: !Format [ "unverified-%s", !Env [ E2E_EMAIL, e2e@example.test ] ]
      password: !Env [ E2E_PASSWORD, "" ]
      is_active: true
      path: users

  - model: authentik_core.user
    id: registry-user-selfpurge
    identifiers:
      username: !Format [ "%s-selfpurge", !Env [ E2E_USERNAME, e2e ] ]
    attrs:
      name: Selfserve Purge
      attributes:
        given_name: Selfserve
        family_name: Purge
      email: !Format [ "selfpurge-%s", !Env [ E2E_EMAIL, e2e@example.test ] ]
      password: !Env [ E2E_PASSWORD, "" ]
      is_active: true
      path: users

  # Default Authentik puts the whole display name in given_name and leaves
  # family_name empty; the backend needs a real given/family split, so emit the
  # claims from the user attributes set above.
  - model: authentik_providers_oauth2.scopemapping
    id: registry-profile-scope
    identifiers:
      name: Registry E2E profile
    attrs:
      scope_name: profile
      description: E2E profile claims (split given/family name)
      expression: |
        return {
            "name": request.user.name,
            "given_name": request.user.attributes.get("given_name", request.user.name),
            "family_name": request.user.attributes.get("family_name", ""),
            "preferred_username": request.user.username,
            "nickname": request.user.username,
        }

  # Authentik's default email mapping hardcodes `email_verified: False`. The
  # backend treats a verified address as identity-grade evidence — it is what
  # authorises binding an IdP identity to an invited (email-only) row, so the
  # check is fail-closed and an unverified claim refuses the link with
  # AUTH_EMAIL_NOT_VERIFIED (403). Every account this blueprint seeds is a
  # controlled test identity whose address is known-good, so assert it. The
  # attribute lookup keeps the refusal reachable: `-unverified` above opts out,
  # which is the account the AUTH_EMAIL_NOT_VERIFIED journey signs in as.
  - model: authentik_providers_oauth2.scopemapping
    id: registry-email-scope
    identifiers:
      name: Registry E2E email
    attrs:
      scope_name: email
      description: E2E email claims (address asserted as verified)
      expression: |
        return {
            "email": request.user.email,
            "email_verified": request.user.attributes.get("email_verified", True),
        }

  # App-password token used by global-setup/teardown as the `password` in the
  # password grant (Authentik looks it up by intent app_password + user).
  - model: authentik_core.token
    identifiers:
      identifier: registry-e2e-cleanup
    attrs:
      user: !KeyOf registry-user
      intent: app_password
      key: !Env [ E2E_CLEANUP_TOKEN, "" ]
      expiring: false
      description: Registry E2E teardown cleanup (app-password grant)

  # RP-initiated logout has to do BOTH halves, and neither Authentik default does:
  # `default-provider-invalidation-flow` honours post_logout_redirect_uri but ships
  # with no stages, so it drops the application session and leaves the SSO one
  # alive — the next protected page signs the user straight back in;
  # `default-invalidation-flow` does carry the user-logout stage, but it is the
  # brand's own logout flow and ends on Authentik's login page instead of returning
  # to the app. So the provider gets its own invalidation flow: the shipped logout
  # stage, reached through the provider, which returns to post_logout_redirect_uri.
  - model: authentik_flows.flow
    id: registry-invalidation-flow
    identifiers:
      slug: registry-provider-invalidation
    attrs:
      name: Logged out of Registry
      title: You have been logged out
      designation: invalidation

  - model: authentik_flows.flowstagebinding
    identifiers:
      target: !KeyOf registry-invalidation-flow
      order: 0
    attrs:
      stage: !Find [ authentik_stages_user_logout.userlogoutstage, [ name, default-invalidation-logout ] ]

  - model: authentik_providers_oauth2.oauth2provider
    id: registry-provider
    identifiers:
      name: registry
    attrs:
      client_type: confidential
      client_id: !Context registry_client_id
      client_secret: !Context registry_client_secret
      # Enable the browser flow (authorization_code + refresh) and the suite's
      # cleanup (password grant). Empty by default → all grants 400.
      grant_types:
        - authorization_code
        - refresh_token
        - password
      # The backend parses `sub` as a UUID (TokenConverterService); Authentik's
      # default hashed_user_id is not one, which 500s every authenticated call.
      sub_mode: user_uuid
      authentication_flow: !Find [ authentik_flows.flow, [ slug, default-authentication-flow ] ]
      authorization_flow: !Find [ authentik_flows.flow, [ slug, default-provider-authorization-implicit-consent ] ]
      invalidation_flow: !KeyOf registry-invalidation-flow
      signing_key: !Find [ authentik_crypto.certificatekeypair, [ name, authentik Self-signed Certificate ] ]
      # :3001 is the short-session Nuxt instance (ci/compose.e2e.yml) the
      # session-lifetime journeys run against; it completes the same
      # authorization-code flow, so its callback must be registered too.
      redirect_uris:
        - matching_mode: strict
          url: http://localhost:3000/auth/callback
        - matching_mode: strict
          url: http://localhost:3001/auth/callback
      # offline_access is what makes the IdP issue a usable refresh token. Without
      # this mapping Authentik hands out none at all, the BFF's silent renewal has
      # nothing to renew with, and every session dies the moment its access token
      # expires. The app requests the scope in server/routes/auth/login.get.ts.
      property_mappings:
        - !Find [ authentik_providers_oauth2.scopemapping, [ scope_name, openid ] ]
        - !Find [ authentik_providers_oauth2.scopemapping, [ scope_name, offline_access ] ]
        - !KeyOf registry-email-scope
        - !KeyOf registry-profile-scope

  - model: authentik_core.application
    identifiers:
      slug: registry
    attrs:
      name: Registry
      provider: !KeyOf registry-provider
